apiVersion: v1
kind: Pod
metadata:
  name: python-dashboard
  labels:
    app: dashboard
spec:
  containers:
    - name: python-app
      image: my-python-dashboard:v1
      imagePullPolicy: Never
      ports:
        - containerPort: 5000
      env:
        - name: POSTGRES_USER
          value: "myuser"
        - name: POSTGRES_PASSWORD
          value: "mysecretpassword"
        - name: POSTGRES_DB
          value: "mydb"
